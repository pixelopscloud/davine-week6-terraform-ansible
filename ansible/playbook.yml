---
- name: Configure Web Servers
  hosts: web
  become: true

  tasks:

    - name: Create devops user
      user:
        name: devops
        state: present
        create_home: true

    - name: Install httpd
      yum:
        name: httpd
        state: present

    - name: Start and enable httpd
      service:
        name: httpd
        state: started
        enabled: true
